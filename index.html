<style>
:root {
  --ice-50:#f0f8ff; --ice-100:#e0f0ff; --ice-200:#baddff; --ice-300:#8ec5f5;
  --accent:#2563eb; --accent-h:#1d4ed8; --accent-l:#eff4ff;
  --ink:#0e1118;
  --text:#0e1118; --text2:#454f68; --text3:#717c94;
  --card:#ffffff; --bg:#f0f8ff; --border:#d8e0ea; --border2:#e7edf4;

  /* Official CanSkate progress-report colours: Balance green, Control orange, Agility blue.
     Header bars use the report's exact pastel fills with DARK text (as on the report). */
  --balance:#c6e0b4; --balance-ink:#2f5318; --balance-edge:#a9cd90;
  --control:#f8cbad; --control-ink:#7a3c10; --control-edge:#efb289;
  --agility:#b4c7e7; --agility-ink:#243f6e; --agility-edge:#94afd9;

  --r:4px;            /* global corner radius — crisp, near-square */
  --z-nav:20; --z-stagenav:25; --z-top:30; --z-panel:40;
  --shadow:0 1px 2px rgba(14,17,24,0.05);
  --shadow-md:0 8px 28px rgba(14,17,24,0.14);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;-webkit-text-size-adjust:100%;scroll-behavior:smooth;}
body{font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-weight:300;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;}
:lang(zh-Hans){font-family:'Noto Sans SC','DM Sans',sans-serif;}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r);}

/* ---- Header ---- */
.top{position:sticky;top:0;z-index:var(--z-top);background:rgba(240,248,255,0.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top);}
.top-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px;max-width:1120px;margin:0 auto;}
.logo{font-family:'DM Sans',sans-serif;font-size:1.2rem;font-weight:700;color:var(--ink);text-decoration:none;letter-spacing:-0.02em;}
.logo span{color:var(--accent);}
.lang-switch{display:flex;gap:2px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:3px;}
.lang-btn{font-family:inherit;font-size:12px;font-weight:500;padding:5px 12px;border:none;border-radius:2px;cursor:pointer;background:transparent;color:var(--text3);transition:background .15s ease-out,color .15s ease-out;min-height:30px;-webkit-tap-highlight-color:transparent;}
.lang-btn.active{background:var(--accent);color:#fff;}

/* ---- Hero ---- */
.hero{padding:44px 0 22px;}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent);margin-bottom:13px;}
h1{font-family:'DM Sans',sans-serif;font-size:clamp(1.8rem,5vw,2.7rem);font-weight:700;line-height:1.12;letter-spacing:-0.025em;margin-bottom:16px;text-wrap:balance;max-width:18ch;}
h1 em{font-style:normal;color:var(--accent);}
.hero-lead{font-size:1.02rem;color:var(--text2);max-width:600px;margin:0 0 6px;line-height:1.65;text-wrap:pretty;}
.hero-sub{font-size:0.85rem;color:var(--text3);max-width:560px;margin:12px 0 0;line-height:1.6;text-wrap:pretty;}

.search-wrap{max-width:520px;margin:22px 0 0;position:relative;}
.search-box{width:100%;font-family:inherit;font-size:0.95rem;font-weight:400;padding:13px 44px;border:1.5px solid var(--border);border-radius:var(--r);background:var(--card);color:var(--text);box-shadow:var(--shadow);transition:border-color .15s ease-out;min-height:48px;}
.search-box::placeholder{color:var(--text3);}
.search-box:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-l);}
.search-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--text3);pointer-events:none;}
.search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:none;background:transparent;color:var(--text3);font-size:1.05rem;cursor:pointer;border-radius:2px;display:none;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;}
.search-clear:hover{background:var(--ice-100);color:var(--text2);}
.search-clear.show{display:flex;}
.search-count{font-size:0.8rem;color:var(--text3);margin-top:11px;min-height:1.2em;}

/* ---- Stage chip nav ---- */
.stage-nav{position:sticky;top:58px;z-index:var(--z-stagenav);background:rgba(240,248,255,0.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:11px 0;margin-bottom:6px;border-bottom:1px solid var(--border);}
.stage-nav-inner{display:flex;gap:7px;overflow-x:auto;padding:0 20px;max-width:1120px;margin:0 auto;scrollbar-width:none;}
.stage-nav-inner::-webkit-scrollbar{display:none;}
.stage-chip{flex:0 0 auto;font-family:inherit;font-size:0.84rem;font-weight:500;padding:7px 15px;border-radius:var(--r);border:1.5px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer;white-space:nowrap;transition:border-color .15s ease-out,background .15s ease-out,color .15s ease-out;min-height:38px;-webkit-tap-highlight-color:transparent;}
.stage-chip:hover{border-color:var(--ice-300);}

/* ================= STAGE BLOCK ================= */
.stages{padding:14px 0 8px;display:flex;flex-direction:column;gap:22px;}
.stage{scroll-margin-top:120px;}
.stage.hidden{display:none;}

/* Horizontal stage title above the block */
.stage-title{display:flex;align-items:baseline;gap:8px;margin:0 2px 10px;}
.stage-title .st-word,
.stage-title .st-num{font-size:0.78rem;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--text3);line-height:1.2;}
.stage-title .st-num{font-variant-numeric:tabular-nums;}
.stage-title .st-count{margin-left:auto;font-size:0.78rem;font-weight:500;color:var(--text3);font-variant-numeric:tabular-nums;letter-spacing:0.02em;}

/* One big rectangle per stage: 3 sections side by side */
.stage-block{
  border:1.5px solid var(--border);
  border-radius:var(--r);
  background:var(--card);
  overflow:hidden;
  box-shadow:var(--shadow);
}
.stage-main{min-width:0;}
.sec-tabs{display:none;}  /* desktop: no tabs, all 3 columns show */
.stage-body{display:grid;grid-template-columns:repeat(3,1fr);}
.section{border-right:1px solid var(--border2);min-width:0;}
.section:last-child{border-right:none;}
.sec-head{padding:10px 14px;font-size:0.76rem;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;display:flex;align-items:center;gap:7px;}
.sec-head.balance{background:var(--balance);color:var(--balance-ink);}
.sec-head.control{background:var(--control);color:var(--control-ink);}
.sec-head.agility{background:var(--agility);color:var(--agility-ink);}
.sec-dot{width:9px;height:9px;border-radius:2px;flex:0 0 auto;}
.sec-dot.balance{background:var(--balance-ink);}
.sec-dot.control{background:var(--control-ink);}
.sec-dot.agility{background:var(--agility-ink);}

.skill-list{list-style:none;}
.skill-row{display:flex;align-items:center;gap:9px;padding:9px 13px;border-bottom:1px solid var(--border2);cursor:pointer;transition:background .12s ease-out;-webkit-tap-highlight-color:transparent;width:100%;text-align:left;border-left:none;border-right:none;border-top:none;background:var(--card);font-family:inherit;min-height:46px;}
.skill-list li:last-child .skill-row{border-bottom:none;}
.skill-row:hover{background:var(--ice-50);}
.section[data-col="balance"] .skill-row:hover{background:color-mix(in srgb, var(--balance) 38%, transparent);}
.section[data-col="control"] .skill-row:hover{background:color-mix(in srgb, var(--control) 38%, transparent);}
.section[data-col="agility"] .skill-row:hover{background:color-mix(in srgb, var(--agility) 38%, transparent);}
.section[data-col="balance"] .skill-row:hover .play-dot{background:color-mix(in srgb, var(--balance) 75%, white);}
.section[data-col="control"] .skill-row:hover .play-dot{background:color-mix(in srgb, var(--control) 75%, white);}
.section[data-col="agility"] .skill-row:hover .play-dot{background:color-mix(in srgb, var(--agility) 75%, white);}
.skill-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
.skill-row.row-hidden{display:none;}
.play-dot{flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:2px;background:var(--accent-l);transition:background .12s ease-out;}
.section[data-col="balance"] .play-dot{background:color-mix(in srgb, var(--balance) 45%, white);}
.section[data-col="control"] .play-dot{background:color-mix(in srgb, var(--control) 45%, white);}
.section[data-col="agility"] .play-dot{background:color-mix(in srgb, var(--agility) 45%, white);}
.section[data-col="balance"] .play-dot svg path{fill:var(--balance-ink);}
.section[data-col="control"] .play-dot svg path{fill:var(--control-ink);}
.section[data-col="agility"] .play-dot svg path{fill:var(--agility-ink);}
.skill-row:hover .play-dot{background:var(--ice-200);}
.play-dot svg{width:10px;height:10px;}
.play-dot.no-vid{background:#eef1f6;}
.skill-text{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:4px;}
.skill-en{display:block;font-size:0.86rem;font-weight:500;color:var(--text);line-height:1.3;}
.skill-en mark,.skill-zh mark{background:#fde68a;color:inherit;padding:0 1px;border-radius:2px;}
.skill-zh{display:block;font-size:0.76rem;color:var(--text3);line-height:1.4;}

/* Empty section (when search filters everything out of a column) */
.sec-empty{padding:14px 13px;font-size:0.78rem;color:var(--text3);}

/* No results */
.no-results{text-align:center;padding:54px 20px;color:var(--text3);display:none;}
.no-results.show{display:block;}
.no-results-icon{font-size:2.2rem;margin-bottom:12px;}
.no-results-action{margin-top:15px;}
.no-results-action button{font-family:inherit;font-size:0.85rem;font-weight:500;color:#fff;background:var(--accent);border:none;border-radius:var(--r);padding:9px 18px;cursor:pointer;min-height:40px;transition:background .15s ease-out;}
.no-results-action button:hover{background:var(--accent-h);}

/* ---- Detail panel ---- */
.panel-backdrop{position:fixed;inset:0;background:rgba(14,17,24,0.5);z-index:var(--z-panel);display:none;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .18s ease-out;}
@media (min-width:640px){.panel-backdrop{align-items:center;padding:24px;}}
.panel-backdrop.open{display:flex;opacity:1;}
.panel{background:var(--card);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow-y:auto;box-shadow:var(--shadow-md);border-radius:var(--r) var(--r) 0 0;transform:translateY(16px);transition:transform .18s ease-out;padding-bottom:env(safe-area-inset-bottom);}
@media (min-width:640px){.panel{border-radius:var(--r);transform:translateY(8px);}}
.panel-backdrop.open .panel{transform:translateY(0);}
.panel-head{position:sticky;top:0;background:var(--card);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px 13px;border-bottom:1px solid var(--border);}
.panel-tag{display:inline-block;font-size:0.66rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;padding:3px 9px;border-radius:2px;margin-bottom:9px;}
.panel-tag.balance{background:var(--balance);color:var(--balance-ink);}
.panel-tag.control{background:var(--control);color:var(--control-ink);}
.panel-tag.agility{background:var(--agility);color:var(--agility-ink);}
.panel-title{font-family:'DM Sans',sans-serif;font-size:1.28rem;font-weight:700;color:var(--ink);line-height:1.2;letter-spacing:-0.015em;text-wrap:balance;}
.panel-subtitle{font-size:0.9rem;color:var(--text3);margin-top:3px;}
.panel-close{flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:var(--r);border:none;background:var(--ice-100);color:var(--text2);font-size:1.05rem;cursor:pointer;transition:background .15s ease-out;}
.panel-close:hover{background:var(--ice-200);}
.panel-body{padding:17px 20px 22px;}
.detail-block{margin-bottom:17px;}
.detail-label{font-size:0.7rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--text3);margin-bottom:6px;}
.detail-text{font-size:0.94rem;color:var(--text2);line-height:1.62;text-wrap:pretty;}
.detail-req{background:var(--ice-50);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;}
.detail-req .detail-text{color:var(--text);}
.detail-divider{height:1px;background:var(--border);margin:18px 0;}
.detail-lang-tag{display:inline-block;font-size:0.66rem;font-weight:600;letter-spacing:0.05em;color:var(--accent);background:var(--accent-l);padding:2px 8px;border-radius:2px;margin-bottom:10px;}
.watch-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--accent);color:#fff;text-decoration:none;font-size:0.95rem;font-weight:600;padding:14px 18px;border-radius:var(--r);transition:background .15s ease-out;min-height:48px;margin-top:6px;}
.watch-btn:hover{background:var(--accent-h);}
.watch-btn svg{width:17px;height:17px;flex:0 0 auto;}
.watch-btn.secondary{background:var(--card);color:var(--accent);border:1.5px solid var(--accent-l);}
.watch-btn.secondary:hover{background:var(--accent-l);}
.no-vid-note{font-size:0.82rem;color:var(--text3);line-height:1.55;margin-bottom:10px;text-align:center;text-wrap:pretty;}
.panel-nav{display:flex;gap:8px;margin-top:14px;}
.panel-nav button{flex:1 1 0;font-family:inherit;font-size:0.82rem;font-weight:500;color:var(--text2);background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);padding:9px;cursor:pointer;transition:border-color .15s ease-out,color .15s ease-out;min-height:42px;}
.panel-nav button:hover:not(:disabled){border-color:var(--accent);color:var(--accent);background:var(--accent-l);}
.panel-nav button:disabled{opacity:0.4;cursor:default;}

.info-banner{background:var(--accent-l);border:1px solid rgba(37,99,235,0.15);border-radius:var(--r);padding:14px 18px;margin:22px 0 8px;font-size:0.85rem;color:var(--text2);line-height:1.6;display:flex;gap:10px;align-items:flex-start;}
.info-banner .ib-icon{flex:0 0 auto;}

footer{padding:36px 20px 56px;color:var(--text3);font-size:0.8rem;line-height:1.6;}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

/* ============ RESPONSIVE ============ */
/* Mobile + small-tablet: stage sections switch via TABS */
@media (max-width:760px){
  /* show the tab bar */
  .sec-tabs{display:flex;border-bottom:1.5px solid var(--border);}
  .sec-tab{
    flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;
    font-family:inherit;font-size:0.75rem;font-weight:700;letter-spacing:0.02em;text-transform:uppercase;
    padding:12px 4px;border:none;border-bottom:3px solid transparent;background:var(--card);
    color:var(--text3);cursor:pointer;min-height:48px;-webkit-tap-highlight-color:transparent;
    transition:color .15s ease-out,background .15s ease-out;
    overflow:hidden;white-space:nowrap;
  }
  .sec-tab .sec-dot{width:8px;height:8px;flex:0 0 auto;}
  .sec-tab .tab-label{overflow:hidden;text-overflow:ellipsis;}
  .sec-tab .tab-count{
    font-size:0.66rem;font-weight:500;color:var(--text3);font-variant-numeric:tabular-nums;
    background:var(--ice-100);padding:2px 6px;border-radius:999px;letter-spacing:0;
    flex:0 0 auto;
  }
  .sec-tab.active.balance{color:var(--balance-ink);background:var(--balance);border-bottom-color:var(--balance-edge);}
  .sec-tab.active.control{color:var(--control-ink);background:var(--control);border-bottom-color:var(--control-edge);}
  .sec-tab.active.agility{color:var(--agility-ink);background:var(--agility);border-bottom-color:var(--agility-edge);}
  /* Inactive tab: muted text, neutral dot */
  .sec-tab:not(.active){color:#a3acc0;}
  .sec-tab:not(.active) .sec-dot{background:#c8cfdb;}
  .sec-tab:not(.active):hover{color:var(--text2);background:var(--ice-50);}
  .sec-tab:not(.active):hover .sec-dot{background:#9aa3b5;}
  .sec-tab.active .tab-count{background:rgba(255,255,255,0.55);color:inherit;}
  .sec-tab.tab-nomatch:not(.active){opacity:0.38;}

  /* one panel at a time; the colored section header is redundant (the tab shows it) */
  .stage-body{grid-template-columns:1fr;}
  .section{border-right:none;}
  .section[data-mtab-hidden]{display:none;}
  .section .sec-head{display:none;}
}

/* Phone (narrow): drop the count badge so the label fits cleanly */
@media (max-width:440px){
  .sec-tab .tab-count{display:none;}
  .sec-tab{font-size:0.78rem;padding:13px 4px;gap:7px;}
  .stage-nav-inner{padding:0 16px;}
  .wrap{padding:0 16px;}
  .top-inner{padding:13px 16px;}
  h1{font-size:1.55rem;}
  .hero{padding:28px 0 18px;}
  .skill-row{padding:11px 14px;}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;}
  html{scroll-behavior:auto;}
}

/* ============ TWEAKS HOOKS ============ */
/* Body classes that get toggled by the tweaks panel. */
body.tw-bg-cream  { --bg:#faf6ef; --ice-50:#fbf7f0; --ice-100:#f3ece0; --ice-200:#e8dcc4; --ice-300:#d7c39e; --border:#e6dbc7; --border2:#efe7d6; --accent-l:#fbeee0; }
body.tw-bg-white  { --bg:#ffffff; --ice-50:#fafafa; --ice-100:#f4f4f5; --ice-200:#e4e4e7; --ice-300:#d4d4d8; --border:#e5e7eb; --border2:#eef0f3; --accent-l:#eef4ff; }
body.tw-bg-slate  { --bg:#eef2f7; --ice-50:#eef2f7; --ice-100:#e2e8f0; --ice-200:#cbd5e1; --ice-300:#94a3b8; --border:#cbd5e1; --border2:#dfe5ec; --accent-l:#e6edfa; }

/* Ribbon palette variants */
body.tw-ribbon-bold {
  --balance:#86c87a; --balance-ink:#0f3a14; --balance-edge:#5da94f;
  --control:#f0995a; --control-ink:#4d1f02; --control-edge:#cf7836;
  --agility:#7393d6; --agility-ink:#13234a; --agility-edge:#506fb0;
}
body.tw-ribbon-bold .sec-head{color:#fff;}
body.tw-ribbon-bold .sec-head.balance{background:var(--balance-edge);}
body.tw-ribbon-bold .sec-head.control{background:var(--control-edge);}
body.tw-ribbon-bold .sec-head.agility{background:var(--agility-edge);}
body.tw-ribbon-bold .panel-tag{color:#fff;}
body.tw-ribbon-bold .panel-tag.balance{background:var(--balance-edge);}
body.tw-ribbon-bold .panel-tag.control{background:var(--control-edge);}
body.tw-ribbon-bold .panel-tag.agility{background:var(--agility-edge);}

body.tw-ribbon-mono .sec-head{background:transparent;color:var(--text2);border-bottom:1px solid var(--border);padding-left:14px;}
body.tw-ribbon-mono .sec-head .sec-dot{display:none;}
body.tw-ribbon-mono .sec-tab.active{background:transparent;color:var(--text);border-bottom-color:var(--accent)!important;}
body.tw-ribbon-mono .panel-tag{background:var(--ice-100)!important;color:var(--text2)!important;}

/* Block styles */
body.tw-block-flat .stage-block{border:none;box-shadow:none;background:transparent;}
body.tw-block-flat .section{border-right:1px solid var(--border);}
body.tw-block-flat .section:last-child{border-right:none;}

body.tw-block-elevated .stage-block{border:none;box-shadow:0 6px 24px rgba(14,17,24,0.08), 0 1px 2px rgba(14,17,24,0.04);}

/* Density */
body.tw-density-compact .skill-row{padding:6px 12px;min-height:38px;}
body.tw-density-compact .skill-en{font-size:0.83rem;}
body.tw-density-compact .skill-zh{font-size:0.72rem;}
body.tw-density-compact .sec-head{padding:7px 12px;font-size:0.72rem;}
body.tw-density-compact .stages{gap:14px;}
body.tw-density-compact .hero{padding:30px 0 16px;}

body.tw-density-comfy .skill-row{padding:13px 16px;min-height:54px;}
body.tw-density-comfy .skill-en{font-size:0.92rem;}
body.tw-density-comfy .skill-zh{font-size:0.8rem;}
body.tw-density-comfy .sec-head{padding:13px 18px;font-size:0.8rem;}
body.tw-density-comfy .stages{gap:30px;}

/* Hide Mandarin subtitle inline */
body.tw-no-subtitle .skill-zh{display:none;}

/* Heading-font swaps */
body.tw-font-fraunces h1,
body.tw-font-fraunces .panel-title{font-family:'Fraunces','DM Serif Display',serif;letter-spacing:-0.01em;}
body.tw-font-jakarta h1,
body.tw-font-jakarta .panel-title{font-family:'Plus Jakarta Sans','DM Sans',sans-serif;}
body.tw-font-spacegrotesk h1,
body.tw-font-spacegrotesk .panel-title{font-family:'Space Grotesk','DM Sans',sans-serif;}

</style>

</div>

const STAGE_ORDER = ['1','2','3','4','5','6'];
const RIBBONS = ['balance','control','agility'];

let FLAT = [];
function buildFlat(){
  FLAT = [];
  STAGE_ORDER.forEach(s=>{
    RIBBONS.forEach(rib=>(SKILLS[s][rib]||[]).forEach(sk=>FLAT.push({...sk, stage:s, ribbon:rib})));
  });
  FLAT.forEach((f,i)=>f.idx=i);
}

function setLang(lang){
  LANG = lang;
  document.getElementById('root').lang = lang==='zh'?'zh-Hans':'en';
  document.getElementById('lang-en').classList.toggle('active',lang==='en');
  document.getElementById('lang-zh').classList.toggle('active',lang==='zh');
  document.getElementById('lang-en').setAttribute('aria-pressed',lang==='en');
  document.getElementById('lang-zh').setAttribute('aria-pressed',lang==='zh');
  render(); onSearch();
  if(currentIdx>=0 && document.getElementById('panel').classList.contains('open')) fillPanel(currentIdx);
}

function render(){
  const t = UI[LANG];
  document.getElementById('hero-title').innerHTML = t.heroTitle;
  document.getElementById('hero-lead').textContent = t.heroLead;
  document.getElementById('hero-sub').textContent = t.heroSub;
  document.getElementById('info-text').innerHTML = t.infoText;
  document.getElementById('footer-text').innerHTML = t.footer;

  document.getElementById('stage-nav').innerHTML = STAGE_ORDER.map(s=>{
    const label = LANG==='zh'?SKILLS[s].label_zh:SKILLS[s].label_en;
    return `<button type="button" class="stage-chip" onclick="jumpTo('stage-${s}')">${label}</button>`;
  }).join('');

  document.getElementById('stages').innerHTML = STAGE_ORDER.map(renderStage).join('');
}

function countVids(s){
  let v=0,n=0; RIBBONS.forEach(r=>(SKILLS[s][r]||[]).forEach(sk=>{n++; if(sk.vid)v++;}));
  return {v,n};
}

function renderStage(s){
  const t = UI[LANG];
  const numLabel = LANG==='zh' ? SKILLS[s].label_zh : (t.stageWord+' '+s);
  const {v,n}=countVids(s);
  let sections='', tabs='';
  RIBBONS.forEach((rib,i)=>{
    const rows=(SKILLS[s][rib]||[]).map(sk=>skillRow(sk,rib,s)).join('');
    const active = i===0;
    const cv=(SKILLS[s][rib]||[]).filter(sk=>sk.vid).length, cn=(SKILLS[s][rib]||[]).length;
    tabs+=`<button type="button" role="tab" id="tab-${s}-${rib}" class="sec-tab ${rib}${active?' active':''}"
      aria-selected="${active}" aria-controls="panel-${s}-${rib}" tabindex="${active?0:-1}"
      onclick="selectTab('${s}','${rib}')">
      <span class="sec-dot ${rib}" aria-hidden="true"></span><span class="tab-label">${t[rib]}</span></button>`;
    sections+=`<div class="section" data-col="${rib}" id="panel-${s}-${rib}" role="tabpanel"
      aria-labelledby="tab-${s}-${rib}"${active?'':' data-mtab-hidden'}>
      <div class="sec-head ${rib}"><span class="sec-dot ${rib}" aria-hidden="true"></span>${t[rib]}</div>
      <ul class="skill-list">${rows}</ul>
      <p class="sec-empty" hidden>${t.secEmpty}</p>
    </div>`;
  });
  return `<section class="stage" id="stage-${s}" aria-label="${LANG==='zh'?numLabel:(t.stageWord+' '+s)}">
    <div class="stage-title">
      <span class="st-word">${t.stageWord}</span>
      <span class="st-num">${s}</span>
      <span class="st-count">${n} ${LANG==='zh'?'个动作':(n===1?'move':'moves')}</span>
    </div>
    <div class="stage-block">
      <div class="stage-main">
        <div class="sec-tabs" role="tablist" aria-label="${t.stageWord} ${s}" onkeydown="tabKeydown(event,'${s}')">${tabs}</div>
        <div class="stage-body">${sections}</div>
      </div>
    </div>
  </section>`;
}

function skillRow(sk, ribbon, stage){
  const name = LANG==='zh'?sk.zh:sk.en;
  const sub  = LANG==='zh'?sk.en:sk.zh;
  const hasVid = !!sk.vid;
  const fi = FLAT.find(f=>f.stage===stage && f.ribbon===ribbon && f.en===sk.en);
  const idx = fi?fi.idx:-1;
  const playIcon = hasVid
    ? `<svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3 2l7 4-7 4V2z" fill="var(--accent)"/></svg>`
    : `<svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><circle cx="6" cy="6" r="4.5" stroke="#94a3b8" stroke-width="1.2"/><path d="M6 4v2.5M6 8h.01" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/></svg>`;
  const hay = (sk.en+' '+sk.zh+' '+(sk.desc_en||'')+' '+(sk.desc_zh||'')).toLowerCase().replace(/"/g,'&quot;');
  return `<li><button type="button" class="skill-row" data-flat="${idx}" data-hay="${hay}" onclick="openPanel(${idx})">
    <span class="play-dot ${hasVid?'':'no-vid'}">${playIcon}</span>
    <span class="skill-text"><span class="skill-en">${esc(name)}</span><span class="skill-zh">${esc(sub)}</span></span>
  </button></li>`;
}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

/* Search (search bar removed; function kept so legacy calls are no-ops and rows stay visible) */
function onSearch(){
  document.querySelectorAll('.skill-row').forEach(r=>{ r.hidden = false; r.querySelector('.skill-en').innerHTML = esc(r.querySelector('.skill-en').textContent); const zh = r.querySelector('.skill-zh'); if(zh) zh.innerHTML = esc(zh.textContent); });
  document.querySelectorAll('.stage').forEach(s=>s.classList.remove('hidden'));
  document.querySelectorAll('.sec-empty').forEach(e=>e.hidden=true);
  document.querySelectorAll('.sec-tab').forEach(t=>t.classList.remove('tab-nomatch'));
  const nr=document.getElementById('no-results'); if(nr) nr.classList.remove('show');
}
function hl(text){return esc(text);}
function clearSearch(){}

  let watch;
  if(sk.vid){
    watch = `<a class="watch-btn" href="https://www.youtube.com/watch?v=${sk.vid}" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.6 7.2a2.7 2.7 0 0 0-1.9-1.9C18 4.8 12 4.8 12 4.8s-6 0-7.7.5A2.7 2.7 0 0 0 2.4 7.2 28 28 0 0 0 1.9 12a28 28 0 0 0 .5 4.8 2.7 2.7 0 0 0 1.9 1.9c1.7.5 7.7.5 7.7.5s6 0 7.7-.5a2.7 2.7 0 0 0 1.9-1.9 28 28 0 0 0 .5-4.8 28 28 0 0 0-.5-4.8zM10 15V9l5 3z"/></svg>
      ${t.watch}</a>`;
  } else {
    watch = `<p class="no-vid-note">${t.noVidNote}</p>
      <a class="watch-btn secondary" href="${PLAYLIST_URL}" target="_blank" rel="noopener">${t.watchNoVid} ↗</a>`;
  }

  document.getElementById('panel-body').innerHTML = `
    <div class="detail-block">
      <div class="detail-label">${t.descLabel}</div>
      <p class="detail-text">${esc(primaryDesc)}</p>
    </div>
    <div class="detail-block">
      <div class="detail-label">${t.reqLabel}</div>
      <div class="detail-req"><p class="detail-text">${esc(primaryReq)}</p></div>
    </div>
    ${watch}
    <div class="detail-divider"></div>
    <span class="detail-lang-tag">${otherTag}</span>
    <div class="detail-block">
      <div class="detail-label">${t.descLabel}</div>
      <p class="detail-text">${esc(otherDesc)}</p>
    </div>
    <div class="detail-block" style="margin-bottom:4px;">
      <div class="detail-label">${t.reqLabel}</div>
      <div class="detail-req"><p class="detail-text">${esc(otherReq)}</p></div>
    </div>
    <div class="panel-nav">
      <button type="button" onclick="navPanel(-1)" ${idx<=0?'disabled':''}>${t.prev}</button>
      <button type="button" onclick="navPanel(1)" ${idx>=FLAT.length-1?'disabled':''}>${t.next}</button>
    </div>`;
  document.querySelector('.panel').scrollTop=0;
}
function navPanel(d){const i=currentIdx+d; if(i<0||i>=FLAT.length) return; fillPanel(i); document.getElementById('panel-close').focus();}
function closePanel(){
  document.getElementById('panel').classList.remove('open');
  document.body.style.overflow='';
  if(lastFocused) lastFocused.focus();
}
function jumpTo(id){const el=document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'});}

/* Mobile section tabs (WAI-ARIA tab pattern) */
function selectTab(stage, rib){
  RIBBONS.forEach(r=>{
    const tab=document.getElementById(`tab-${stage}-${r}`);
    const panel=document.getElementById(`panel-${stage}-${r}`);
    const on = r===rib;
    tab.classList.toggle('active', on);
    tab.setAttribute('aria-selected', on);
    tab.tabIndex = on?0:-1;
    if(on) panel.removeAttribute('data-mtab-hidden'); else panel.setAttribute('data-mtab-hidden','');
  });
}
function tabKeydown(e, stage){
  const keys=['ArrowLeft','ArrowRight','Home','End'];
  if(!keys.includes(e.key)) return;
  e.preventDefault();
  const cur = RIBBONS.findIndex(r=>document.getElementById(`tab-${stage}-${r}`).getAttribute('aria-selected')==='true');
  let next = cur;
  if(e.key==='ArrowLeft') next=(cur-1+RIBBONS.length)%RIBBONS.length;
  else if(e.key==='ArrowRight') next=(cur+1)%RIBBONS.length;
  else if(e.key==='Home') next=0;
  else if(e.key==='End') next=RIBBONS.length-1;
  selectTab(stage, RIBBONS[next]);
  document.getElementById(`tab-${stage}-${RIBBONS[next]}`).focus();
}

document.addEventListener('keydown', e=>{
  const open = document.getElementById('panel').classList.contains('open');
  if(!open) return;
  if(e.key==='Escape'){ closePanel(); return; }
  if(e.key==='ArrowRight'){ navPanel(1); return; }
  if(e.key==='ArrowLeft'){ navPanel(-1); return; }
  if(e.key==='Tab'){
    const f = document.querySelector('.panel').querySelectorAll('button:not([disabled]), a[href]');
    if(!f.length) return;
    const first=f[0], last=f[f.length-1];
    if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
  }
});

buildFlat();
render();
onSearch();
</script>
